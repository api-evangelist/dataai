name: Data.ai
description: 'Data.ai (founded as App Annie in 2010, rebranded to data.ai in 2022) was a mobile app
  market-data and analytics provider, offering estimates of app downloads, revenue, usage, and competitive
  market intelligence across the iOS App Store and Google Play for publishers, brands, and investors.
  The company historically exposed a market-data API (api.data.ai) for programmatic access to app
  performance and store intelligence. Data.ai was acquired by Sensor Tower in 2024 and now operates as
  a Sensor Tower company; its standalone site is a gated login and the former public API host serves a
  default page, so its independent API surface has been consolidated into Sensor Tower and effectively
  retired. Surfaced in the API Evangelist network as an ivp portfolio company.'
